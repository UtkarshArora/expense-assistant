name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  integration:
    # Row-level security and least-privilege checks against a real Postgres,
    # set up the same way docker-compose.yml does on first boot.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: expense_pass
          POSTGRES_DB: expense_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_user -d expense_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://expense_user:expense_pass@localhost:5432/expense_db
      AGENT_DATABASE_URL: postgresql://agent_reader:agent_reader_pass@localhost:5432/expense_db
      PGPASSWORD: expense_pass
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Seed the database and apply security
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U expense_user -d expense_db -f ../seed_expenses.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U expense_user -d expense_db -f ../db/02_security.sql

      - name: Run integration tests
        run: python -m pytest -m integration -v
